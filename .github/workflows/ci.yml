name: CI

on:
  push:
    branches:
      - main
      - demo
  pull_request:
    branches:
      - main
      - demo

jobs:
  quality:
    name: Lint, test, typecheck, and build
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=8192

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        timeout-minutes: 20
        run: |
          pnpm test:prepare
          pnpm exec vitest run --maxWorkers=1 --no-file-parallelism --execArgv=--max-old-space-size=8192 --reporter=default --reporter=hanging-process

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
